name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      image:
        description: "Image to release (name from images.yaml, or 'all')"
        required: true
        default: all
        type: string

permissions:
  contents: write

jobs:
  detect:
    name: Detect images to release
    runs-on: ubuntu-24.04
    outputs:
      any_changed: ${{ steps.detect.outputs.any_changed }}
      images: ${{ steps.detect.outputs.images }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need token that can push tags/commits back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip version-bump commits
        id: skip
        run: |
          msg="${{ github.event.head_commit.message }}"
          if [ "${{ github.event_name }}" = "push" ] && echo "$msg" | grep -q '^Bump version'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release for version-bump commit"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare (uv venv + tools)
        if: steps.skip.outputs.skip != 'true'
        run: make prepare

      - name: Detect changed images
        id: detect
        if: steps.skip.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="${PWD}/.venv/bin:${PWD}/.bin:${HOME}/.local/bin:${PATH}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            json="$(bash scripts/detect-changed-images.sh --force "${INPUT_IMAGE}" --format json)"
          else
            base="${BEFORE}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="origin/master"
            fi
            json="$(bash scripts/detect-changed-images.sh --base "$base" --head "$SHA" --format json)"
          fi
          echo "json=$json"
          any="$(.venv/bin/python -c 'import json,sys; print(str(json.loads(sys.argv[1])["any_changed"]).lower())' "$json")"
          images="$(.venv/bin/python -c 'import json,sys; print(",".join(json.loads(sys.argv[1])["images"]))' "$json")"
          {
            echo "any_changed=$any"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build, push, tag
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # So make push-release can update master
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare tools
        run: make prepare

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Release images
        env:
          DOCKER_NAMESPACE: lyricistmarbling
        run: |
          set -euo pipefail
          bash scripts/release-bump.sh --images "${{ needs.detect.outputs.images }}"

      - name: Push release commit and tags
        run: make push-release
