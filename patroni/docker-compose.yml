services:
  patroni:
    build:
      context: .
    image: patroni:latest
    ports:
      - "8008:8008"
      - "5432:5432"
    user: postgres
    volumes:
      - /var/lib/postgres/multiadmin/:/patroni_db/
    environment:
      TZ: UTC
      PATRONI_NAME: db_01
      PATRONI_POSTGRESQL_DATA_DIR: /patroni_db/postgresql/data
      PATRONI_CONSUL_HOST: http://consul:8500
      PATRONI_CONSUL_URL: http://consul:8500/v1/
    restart: unless-stopped
  consul:
      container_name: consul
      image: consul:1.15.4
      hostname: "${HOSTNAME}"
      environment:
        TZ: UTC
      ports:
        - "8300:8300"
        - "8301:8301"
        - "8301:8301/udp"
        - "8302:8302"
        - "8302:8302/udp"
        - "8400:8400"
        - "8500:8500"
        - "8600:8600/udp"
      restart: unless-stopped
      command: agent -server -advertise 192.168.1.131 -bootstrap-expect 3 -client 0.0.0.0  -retry-join 192.168.1.133 -retry-join 192.168.1.132
